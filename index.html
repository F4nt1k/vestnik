<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mini App</title>
    <!-- Подключение API Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        button { background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Привет!</h1>
    <div id="user-data"></div>
    <button id="close-btn">Закрыть приложение</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на всё окно

        // Вывод имени пользователя
        const userDiv = document.getElementById('user-data');
        userDiv.innerText = `Пользователь: ${tg.initDataUnsafe?.user?.first_name || 'Неизвестен'}`;

        // Кнопка закрытия
        document.getElementById('close-btn').addEventListener('click', () => {
            tg.close();
        });
    </script>
</body>
</html>
